<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>관리자 — 세상에서 제일 운이 좋은 사람</title>
<link rel="stylesheet" href="/style.css">
<style>
  .admin{max-width:960px;margin:0 auto;padding:24px 14px}
  .admin h1{font-size:28px;text-align:left}
  .admin .bar{display:flex;gap:8px;margin:14px 0;flex-wrap:wrap;align-items:center}
  .admin .bar input{flex:1;min-width:180px}
  table{width:100%;border-collapse:collapse;font-size:14px}
  th,td{padding:9px 8px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
  th{color:var(--muted);font-weight:500;font-size:12px}
  td.n{text-align:right;font-variant-numeric:tabular-nums}
  tr.banned td{opacity:.5}
  .act{display:flex;gap:6px}
  .act button{border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:8px;padding:5px 9px;font:inherit;font-size:12px;cursor:pointer}
  .act button:hover{border-color:var(--accent)}
  .tw{overflow-x:auto}
  .note{color:var(--muted);font-size:13px;margin-top:10px}
</style>
</head>
<body>
<div class="admin">
  <h1>관리자</h1>
  <div class="note" id="who">확인 중…</div>
  <div id="panel" hidden>
    <div class="bar">
      <input id="q" placeholder="아이디·닉네임 검색">
      <button class="btn ghost" id="reload" style="margin:0">새로고침</button>
      <a class="link" href="/">← 게임으로</a>
    </div>
    <div class="card tw">
      <table>
        <thead><tr><th>#</th><th>아이디</th><th>닉네임</th><th>최고</th><th>도전</th><th>누른 수</th><th>가입</th><th>마지막</th><th></th></tr></thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
    <p class="note">기록 초기화: 최고 기록을 0으로 돌려 리더보드에서 빠져요. 정지: 로그인이 풀리고 리더보드에서 숨겨져요.</p>
  </div>
</div>
<div class="modal" id="dlg" hidden>
  <form class="card" id="dlgForm">
    <h3 id="dlgTitle"></h3>
    <div id="dlgBody" class="muted"></div>
    <input id="dlgInput" maxlength="12" hidden>
    <div class="row">
      <button type="button" class="btn ghost" id="dlgCancel">취소</button>
      <button type="submit" class="btn" id="dlgOk">확인</button>
    </div>
  </form>
</div>
<script>
(() => {
  const $ = id => document.getElementById(id);
  let sess = null; try { sess = localStorage.getItem('lucky_sess'); } catch (e) {}
  async function api(body) {
    try {
      const r = await fetch('/api', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(Object.assign({ sess }, body)) });
      return Object.assign({ status: r.status }, await r.json().catch(() => ({})));
    } catch (e) { return { status: 0, error: '연결 실패' }; }
  }
  const fmt = ms => ms ? new Date(ms).toLocaleString('ko-KR', { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' }) : '-';
  // 확인 창 (브라우저 confirm 대신)
  function ask(title, body, input) {
    return new Promise(res => {
      $('dlgTitle').textContent = title; $('dlgBody').textContent = body || '';
      $('dlgInput').hidden = input == null; $('dlgInput').value = input || '';
      $('dlg').hidden = false; if (input != null) $('dlgInput').focus();
      const done = v => { $('dlg').hidden = true; $('dlgForm').onsubmit = null; $('dlgCancel').onclick = null; res(v); };
      $('dlgForm').onsubmit = e => { e.preventDefault(); done(input == null ? true : $('dlgInput').value.trim()); };
      $('dlgCancel').onclick = () => done(null);
    });
  }
  async function load() {
    const r = await api({ t: 'adminUsers', q: $('q').value.trim() });
    if (r.status !== 200) { $('who').textContent = r.status === 401 ? '먼저 게임 화면에서 로그인해 주세요.' : (r.error || '불러오지 못했어요'); $('panel').hidden = true; return; }
    $('who').textContent = `회원 ${r.users.length}명 (최대 200명 표시)`; $('panel').hidden = false;
    $('rows').replaceChildren(...r.users.map((u, i) => {
      const tr = document.createElement('tr'); if (u.banned) tr.className = 'banned';
      const cells = [i + 1, u.username, u.nick + (u.banned ? ' (정지)' : ''), u.best, u.plays, u.picks, fmt(u.createdAt), fmt(u.lastSeen)];
      cells.forEach((v, k) => { const td = document.createElement('td'); td.textContent = v; if ([0, 3, 4, 5].includes(k)) td.className = 'n'; tr.appendChild(td); });
      const td = document.createElement('td'); const act = document.createElement('div'); act.className = 'act';
      const btn = (label, fn) => { const b = document.createElement('button'); b.type = 'button'; b.textContent = label; b.onclick = fn; act.appendChild(b); };
      btn('닉네임', async () => { const v = await ask(`${u.username} 닉네임 변경`, '', u.nick); if (v) { await api({ t: 'adminNick', id: u.id, nick: v }); load(); } });
      btn('기록 초기화', async () => { if (await ask('기록 초기화', `${u.nick}(${u.username})의 최고 기록 ${u.best}단계를 0으로 돌릴까요?`)) { await api({ t: 'adminResetBest', id: u.id }); load(); } });
      btn(u.banned ? '정지 해제' : '정지', async () => { if (await ask(u.banned ? '정지 해제' : '이용 정지', `${u.nick}(${u.username})을 ${u.banned ? '정지 해제할까요?' : '정지할까요?'}`)) { await api({ t: 'adminBan', id: u.id, banned: !u.banned }); load(); } });
      td.appendChild(act); tr.appendChild(td); return tr;
    }));
  }
  let qt = 0;
  $('q').addEventListener('input', () => { clearTimeout(qt); qt = setTimeout(load, 300); });
  $('reload').addEventListener('click', load);
  load();
})();
</script>
</body>
</html>
