<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin — The Luckiest Person in the World</title>
<link rel="stylesheet" href="/style.css">
<style>
  .admin{max-width:960px;margin:0 auto;padding:24px 14px}
  .admin h1{font-size:28px;text-align:left}
  .admin .bar{display:flex;gap:8px;margin:14px 0;flex-wrap:wrap;align-items:center}
  .admin .bar input{flex:1;min-width:180px}
  table{width:100%;border-collapse:collapse;font-size:14px}
  th,td{padding:9px 8px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
  th{color:var(--muted);font-weight:500;font-size:12px}
  td.n{text-align:right;font-variant-numeric:tabular-nums}
  tr.banned td{opacity:.5}
  .act{display:flex;gap:6px}
  .act button{border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:8px;padding:5px 9px;font:inherit;font-size:12px;cursor:pointer}
  .act button:hover{border-color:var(--accent)}
  .tw{overflow-x:auto}
  .note{color:var(--muted);font-size:13px;margin-top:10px}
</style>
</head>
<body>
<div class="admin">
  <h1>Admin</h1>
  <div class="note" id="who">Checking…</div>
  <form id="keyForm" class="bar" hidden>
    <input id="keyInput" type="password" placeholder="Admin key (ADMIN_KEY)" autocomplete="current-password">
    <button class="btn" style="margin:0">Unlock</button>
  </form>
  <div id="panel" hidden>
    <div class="bar">
      <input id="q" placeholder="Search nickname">
      <button class="btn ghost" id="reload" style="margin:0">Refresh</button>
      <a class="link" href="/">← Back to game</a>
    </div>
    <div class="card tw">
      <table>
        <thead><tr><th>#</th><th>Nickname</th><th>Best</th><th>Runs</th><th>Presses</th><th>Joined</th><th>Last seen</th><th></th></tr></thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
    <p class="note">Reset record: sets their best to 0 and removes them from the leaderboard. Suspend: removes them from the game and the leaderboard, and keeps the nickname reserved.</p>
  </div>
</div>
<div class="modal" id="dlg" hidden>
  <form class="card" id="dlgForm">
    <h3 id="dlgTitle"></h3>
    <div id="dlgBody" class="muted"></div>
    <input id="dlgInput" maxlength="12" hidden>
    <div class="row">
      <button type="button" class="btn ghost" id="dlgCancel">Cancel</button>
      <button type="submit" class="btn" id="dlgOk">OK</button>
    </div>
  </form>
</div>
<script>
(() => {
  const $ = id => document.getElementById(id);
  let key = ''; try { key = sessionStorage.getItem('lucky_admin_key') || ''; } catch (e) {}
  async function api(body) {
    try {
      const r = await fetch('/api', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(Object.assign({ key }, body)) });
      return Object.assign({ status: r.status }, await r.json().catch(() => ({})));
    } catch (e) { return { status: 0, error: 'Connection failed' }; }
  }
  const fmt = ms => ms ? new Date(ms).toLocaleString('en-US', { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' }) : '-';
  // confirm dialog (instead of window.confirm)
  function ask(title, body, input) {
    return new Promise(res => {
      $('dlgTitle').textContent = title; $('dlgBody').textContent = body || '';
      $('dlgInput').hidden = input == null; $('dlgInput').value = input || '';
      $('dlg').hidden = false; if (input != null) $('dlgInput').focus();
      const done = v => { $('dlg').hidden = true; $('dlgForm').onsubmit = null; $('dlgCancel').onclick = null; res(v); };
      $('dlgForm').onsubmit = e => { e.preventDefault(); done(input == null ? true : $('dlgInput').value.trim()); };
      $('dlgCancel').onclick = () => done(null);
    });
  }
  async function load() {
    const r = await api({ t: 'adminUsers', q: $('q').value.trim() });
    if (r.status !== 200) {
      $('who').textContent = key ? (r.error || "Couldn't load users") : 'Enter the admin key to continue.';
      $('panel').hidden = true; $('keyForm').hidden = false; $('keyInput').focus();
      return;
    }
    $('who').textContent = `${r.users.length} player${r.users.length === 1 ? '' : 's'} (showing up to 200)`; $('panel').hidden = false; $('keyForm').hidden = true;
    $('rows').replaceChildren(...r.users.map((u, i) => {
      const tr = document.createElement('tr'); if (u.banned) tr.className = 'banned';
      const cells = [i + 1, u.nick + (u.banned ? ' (suspended)' : ''), u.best, u.plays, u.picks, fmt(u.createdAt), fmt(u.lastSeen)];
      cells.forEach((v, k) => { const td = document.createElement('td'); td.textContent = v; if ([0, 2, 3, 4].includes(k)) td.className = 'n'; tr.appendChild(td); });
      const td = document.createElement('td'); const act = document.createElement('div'); act.className = 'act';
      const btn = (label, fn) => { const b = document.createElement('button'); b.type = 'button'; b.textContent = label; b.onclick = fn; act.appendChild(b); };
      btn('Nickname', async () => { const v = await ask(`Change nickname for ${u.nick}`, '', u.nick); if (v) { const r = await api({ t: 'adminNick', id: u.id, nick: v }); if (r.status !== 200) await ask('Not changed', r.error || 'Please try again'); load(); } });
      btn('Reset record', async () => { if (await ask('Reset record', `Reset ${u.nick}'s best of level ${u.best} to 0?`)) { await api({ t: 'adminResetBest', id: u.id }); load(); } });
      btn(u.banned ? 'Unsuspend' : 'Suspend', async () => { if (await ask(u.banned ? 'Unsuspend' : 'Suspend', `${u.banned ? 'Unsuspend' : 'Suspend'} ${u.nick}?`)) { await api({ t: 'adminBan', id: u.id, banned: !u.banned }); load(); } });
      td.appendChild(act); tr.appendChild(td); return tr;
    }));
  }
  $('keyForm').addEventListener('submit', e => {
    e.preventDefault(); key = $('keyInput').value; $('keyInput').value = '';
    try { sessionStorage.setItem('lucky_admin_key', key); } catch (e) {}
    load();
  });
  let qt = 0;
  $('q').addEventListener('input', () => { clearTimeout(qt); qt = setTimeout(load, 300); });
  $('reload').addEventListener('click', load);
  load();
})();
</script>
</body>
</html>
